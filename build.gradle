import org.gradle.api.plugins.internal.DefaultJavaApplication

plugins {
    id 'java'
    id 'application'
    id "io.qameta.allure" version "2.12.0"
}
def aspectJVersion = "1.9.22.1"

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}
configurations {
    agent {
        canBeResolved = true
        canBeConsumed = true
    }
}

dependencies {
    implementation group: 'com.github.javafaker', name: 'javafaker', version: '1.0.2'
    implementation group: 'org.testng', name: 'testng', version: '7.10.2'
    implementation group: 'com.codeborne', name: 'selenide', version: '7.6.1'
    implementation group: 'io.rest-assured', name: 'rest-assured', version: '5.4.0'
    implementation 'io.rest-assured:rest-assured-all:5.4.0'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.18.1'
    implementation 'ch.qos.logback:logback-classic:1.4.11'
    implementation group: 'io.qameta.allure', name: 'allure-testng', version: '2.29.1'
    testImplementation 'org.projectlombok:lombok:1.18.30'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
    agent "org.aspectj:aspectjweaver:$aspectJVersion"

}
test {
    useTestNG()
    jvmArgs = [ "-javaagent:${configurations.agent.singleFile}" ]
}
